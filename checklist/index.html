<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Check-list | FV Vidros</title>
  <meta name="theme-color" content="#00101a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="img/favicon-32x32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Montserrat:ital,wght@0,700;1,800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ TOPO ============ -->
  <header class="topo no-print">
    <div class="topo__barra">
      <button class="topo__voltar" id="btnVoltar" aria-label="Voltar" hidden>
        <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <a href="#/" class="topo__logo"><img src="img/logo-fv-vidros.png" alt="FV Vidros"></a>
      <span class="topo__titulo" id="tituloTela">Check-list</span>
      <a href="#/config" class="topo__cfg" aria-label="Configurações">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </div>
  </header>

  <main id="app" class="no-print"></main>

  <!-- área usada só na impressão / PDF -->
  <div id="impressao"></div>

  <div id="toast" class="toast" role="status"></div>

  <!-- ============ TEMPLATES ============ -->

  <!-- LISTA -->
  <template id="tpl-lista">
    <section class="tela">
      <div class="resumo">
        <div class="resumo__card"><span id="stHoje">0</span><small>Hoje</small></div>
        <div class="resumo__card"><span id="stAbertos">0</span><small>Em andamento</small></div>
        <div class="resumo__card"><span id="stMes">0</span><small>No mês</small></div>
        <div class="resumo__card resumo__card--valor"><span id="stValor">R$ 0</span><small>Faturado no mês</small></div>
      </div>

      <div class="busca">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="busca" placeholder="Buscar por cliente, placa, código, veículo...">
      </div>
      <div class="filtros" id="filtros">
        <button class="chip ativo" data-f="todos">Todos</button>
        <button class="chip" data-f="aberto">Em andamento</button>
        <button class="chip" data-f="finalizado">Finalizados</button>
      </div>

      <ul class="lista" id="lista"></ul>
      <p class="vazio" id="vazio" hidden>Nenhum check-list ainda.<br>Toque em <b>Novo check-list</b> para começar.</p>

      <a href="#/novo" class="fab">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Novo check-list
      </a>
    </section>
  </template>

  <!-- FORMULÁRIO -->
  <template id="tpl-form">
    <form class="tela form" id="form" autocomplete="off" novalidate>

      <div class="passos" id="passos">
        <a href="#s-cliente">Cliente</a><a href="#s-avaria">Avarias</a><a href="#s-itens">Itens</a>
        <a href="#s-problemas">Problemas</a><a href="#s-servico">Serviço</a><a href="#s-venda">Venda</a>
        <a href="#s-fotos">Fotos</a><a href="#s-assin">Assinaturas</a>
      </div>

      <!-- CABEÇALHO -->
      <div class="card card--cab">
        <div class="cab__linha">
          <label class="campo"><span>Cód.</span><input data-k="codigo" inputmode="numeric" required></label>
          <label class="campo"><span>Data</span><input type="date" data-k="data" required></label>
        </div>
        <p class="cab__empresa"><b>F. V. Vidros Automotivos e Acessórios LTDA</b><br>CNPJ: 31.911.270/0001-88</p>
      </div>

      <!-- DADOS CLIENTE -->
      <section class="card" id="s-cliente">
        <h2 class="card__titulo"><i>1</i> Dados do cliente</h2>
        <div class="grade">
          <label class="campo c-2"><span>Cliente *</span><input data-k="cliente.nome" required autocapitalize="words" list="dlClientes"></label>
          <label class="campo"><span>CPF / CNPJ</span><input data-k="cliente.doc" data-mask="doc" inputmode="numeric"></label>
          <label class="campo"><span>Telefone *</span><input data-k="cliente.tel" data-mask="tel" inputmode="tel" required></label>
          <label class="campo"><span>CEP</span><input data-k="cliente.cep" data-mask="cep" inputmode="numeric" id="cep"></label>
          <label class="campo"><span>Bairro</span><input data-k="cliente.bairro" id="bairro"></label>
          <label class="campo c-2"><span>Endereço</span><input data-k="cliente.endereco" id="endereco"></label>
        </div>
        <h3 class="sub">Veículo</h3>
        <div class="grade">
          <label class="campo"><span>Montadora *</span><input data-k="veiculo.montadora" list="dlMontadoras" required></label>
          <label class="campo"><span>Veículo *</span><input data-k="veiculo.modelo" required></label>
          <label class="campo"><span>Ano</span><input data-k="veiculo.ano" inputmode="numeric" maxlength="9"></label>
          <label class="campo"><span>Placa *</span><input data-k="veiculo.placa" data-mask="placa" required class="placa"></label>
        </div>
      </section>

      <!-- AVARIA -->
      <section class="card" id="s-avaria">
        <h2 class="card__titulo"><i>2</i> Avarias</h2>
        <div class="checks">
          <label class="ck"><input type="checkbox" data-k="avaria.sujo"><span>Veículo sujo/molhado, prejudicando a avaliação</span></label>
          <label class="ck"><input type="checkbox" data-k="avaria.guincho"><span>Veículo entregue por guincho</span></label>
        </div>
        <p class="dica">Escolha o tipo e toque no desenho onde está a avaria. Toque numa marca para removê-la.</p>
        <div class="tipos" id="tiposAvaria">
          <button type="button" class="tipo ativo" data-t="A"><b>A</b> Amassado</button>
          <button type="button" class="tipo" data-t="R"><b>R</b> Riscado</button>
          <button type="button" class="tipo" data-t="Q"><b>Q</b> Quebrado</button>
          <button type="button" class="tipo" data-t="T"><b>T</b> Trincado</button>
          <button type="button" class="tipo" data-t="F"><b>F</b> Faltando</button>
        </div>
        <div class="carros" id="carros"></div>
        <button type="button" class="btn btn--leve btn--pq" id="limparMarcas">Limpar marcas</button>
      </section>

      <!-- ITENS / PNEUS / COMBUSTÍVEL -->
      <section class="card" id="s-itens">
        <h2 class="card__titulo"><i>3</i> Itens do veículo</h2>
        <p class="dica"><b class="t-ok">✓ Existente</b> · <b class="t-x">X Inexistente</b> · <b class="t-a">A Avariado</b></p>
        <div class="itens" id="itens"></div>
        <button type="button" class="btn btn--leve btn--pq" id="marcarTodos">Marcar todos como existentes</button>

        <h3 class="sub">Estado dos pneus</h3>
        <div class="pneus" id="pneus"></div>

        <h3 class="sub">Combustível</h3>
        <div class="comb" id="comb"></div>
      </section>

      <!-- PROBLEMAS -->
      <section class="card" id="s-problemas">
        <h2 class="card__titulo"><i>4</i> Observações e problemas</h2>
        <label class="campo"><span>Observações</span><textarea data-k="obs" rows="3" placeholder="Ex.: calha LD quebrada, retrovisor LE quebrado"></textarea></label>
        <label class="campo"><span>Há pertences no interior do veículo? Quais?</span><input data-k="pertences"></label>

        <div class="pergunta">
          <span>Existe alguma luz acesa indicativa de falha no painel?</span>
          <div class="seg"><label><input type="radio" name="luzPainel.v" value="sim" data-k="luzPainel.v"><span>Sim</span></label><label><input type="radio" name="luzPainel.v" value="nao" data-k="luzPainel.v"><span>Não</span></label></div>
          <input data-k="luzPainel.qual" placeholder="Qual?" class="cond" data-show="luzPainel.v=sim">
        </div>
        <div class="pergunta">
          <span>Feito teste do funcionamento do sensor de chuva?</span>
          <div class="seg"><label><input type="radio" name="sensorChuva.v" value="sim" data-k="sensorChuva.v"><span>Sim</span></label><label><input type="radio" name="sensorChuva.v" value="nao" data-k="sensorChuva.v"><span>Não</span></label></div>
          <input data-k="sensorChuva.obs" placeholder="Obs.">
        </div>
        <div class="grade">
          <label class="campo"><span>KM da entrada</span><input data-k="kmEntrada" inputmode="numeric" data-mask="km"></label>
          <label class="campo"><span>KM da saída</span><input data-k="kmSaida" inputmode="numeric" data-mask="km"></label>
        </div>
      </section>

      <!-- SERVIÇO -->
      <section class="card" id="s-servico">
        <h2 class="card__titulo"><i>5</i> Serviço realizado</h2>
        <div class="servicos" id="servicos"></div>
        <label class="campo"><span>Obs.</span><textarea data-k="servicosObs" rows="2"></textarea></label>
      </section>

      <!-- VENDA -->
      <section class="card" id="s-venda">
        <h2 class="card__titulo"><i>6</i> Venda, garantia e equipe</h2>
        <div class="grade">
          <label class="campo"><span>Vendedor(a)</span><input data-k="vendedor" list="dlVendedores"></label>
          <label class="campo"><span>Nº da venda</span><input data-k="numVenda" inputmode="numeric"></label>
          <label class="campo"><span>Valor (R$)</span><input data-k="valor" data-mask="moeda" inputmode="numeric" class="valor"></label>
          <label class="campo"><span>Peça instalada</span><input data-k="peca" placeholder="Ex.: PLK"></label>
        </div>

        <h3 class="sub">Forma de pagamento</h3>
        <div class="seg seg--wrap">
          <label><input type="radio" name="pagamento.forma" value="pix" data-k="pagamento.forma"><span>PIX</span></label>
          <label><input type="radio" name="pagamento.forma" value="dinheiro" data-k="pagamento.forma"><span>Dinheiro</span></label>
          <label><input type="radio" name="pagamento.forma" value="debito" data-k="pagamento.forma"><span>Débito</span></label>
          <label><input type="radio" name="pagamento.forma" value="credito" data-k="pagamento.forma"><span>Crédito</span></label>
        </div>
        <label class="campo cond" data-show="pagamento.forma=pix"><span>PIX — Conta</span><input data-k="pagamento.pixConta"></label>
        <label class="campo cond" data-show="pagamento.forma=credito"><span>Crédito — parcelas / detalhes</span><input data-k="pagamento.credito" placeholder="Ex.: 3x sem juros"></label>

        <h3 class="sub">Garantia de serviço</h3>
        <div class="seg">
          <label><input type="radio" name="garantia.tem" value="sim" data-k="garantia.tem"><span>Sim</span></label>
          <label><input type="radio" name="garantia.tem" value="nao" data-k="garantia.tem"><span>Não</span></label>
        </div>
        <div class="seg seg--wrap cond" data-show="garantia.tem=sim">
          <label><input type="radio" name="garantia.prazo" value="12 meses" data-k="garantia.prazo"><span>12 meses</span></label>
          <label><input type="radio" name="garantia.prazo" value="06 meses" data-k="garantia.prazo"><span>06 meses</span></label>
          <label><input type="radio" name="garantia.prazo" value="90 dias" data-k="garantia.prazo"><span>90 dias</span></label>
          <label><input type="radio" name="garantia.prazo" value="30 dias" data-k="garantia.prazo"><span>30 dias</span></label>
        </div>

        <h3 class="sub">Retorno de garantia</h3>
        <div class="seg">
          <label><input type="radio" name="retorno" value="seguro" data-k="retorno"><span>Seguro</span></label>
          <label><input type="radio" name="retorno" value="particular" data-k="retorno"><span>Particular</span></label>
        </div>

        <div class="grade mt">
          <label class="campo"><span>Vistoriador(a)</span><input data-k="vistoriador" list="dlVendedores"></label>
          <label class="campo"><span>Técnico de instalação</span><input data-k="tecnico" list="dlTecnicos"></label>
          <label class="campo"><span>Horário entrada</span>
            <div class="hora"><input type="time" data-k="horaEntrada"><button type="button" class="agora" data-agora="horaEntrada">Agora</button></div></label>
          <label class="campo"><span>Horário saída</span>
            <div class="hora"><input type="time" data-k="horaSaida"><button type="button" class="agora" data-agora="horaSaida">Agora</button></div></label>
        </div>
      </section>

      <!-- FOTOS -->
      <section class="card" id="s-fotos">
        <h2 class="card__titulo"><i>7</i> Fotos do veículo</h2>
        <p class="dica">Registre as avarias e o estado do veículo na entrada.</p>
        <div class="fotos" id="fotos"></div>
        <label class="btn btn--leve">
          <svg class="ic" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Adicionar fotos
          <input type="file" accept="image/*" multiple id="inFotos" hidden>
        </label>
      </section>

      <!-- ASSINATURAS -->
      <section class="card" id="s-assin">
        <h2 class="card__titulo"><i>8</i> Assinaturas</h2>
        <div class="assins">
          <div class="assin">
            <canvas data-sig="assinaturaCliente"></canvas>
            <div class="assin__rodape"><span>Assinatura Cliente ou Condutor</span><button type="button" class="link" data-limpar="assinaturaCliente">Limpar</button></div>
          </div>
          <div class="assin">
            <canvas data-sig="assinaturaLoja"></canvas>
            <div class="assin__rodape"><span>Assinatura Loja</span><button type="button" class="link" data-limpar="assinaturaLoja">Limpar</button></div>
          </div>
        </div>
      </section>

      <div class="barra-salvar">
        <button type="button" class="btn btn--leve" id="btnRascunho">Salvar</button>
        <button type="submit" class="btn btn--primario">Finalizar check-list</button>
      </div>

      <datalist id="dlMontadoras"></datalist>
      <datalist id="dlVendedores"></datalist>
      <datalist id="dlTecnicos"></datalist>
      <datalist id="dlClientes"></datalist>
    </form>
  </template>

  <!-- VISUALIZAR -->
  <template id="tpl-ver">
    <section class="tela">
      <div class="acoes">
        <button class="btn btn--primario" id="vPdf"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Imprimir / PDF</button>
        <button class="btn btn--whats" id="vWhats"><svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>WhatsApp</button>
        <a class="btn btn--leve" id="vEditar"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Editar</a>
        <button class="btn btn--leve" id="vDuplicar"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Novo p/ este cliente</button>
        <button class="btn btn--perigo" id="vExcluir"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Excluir</button>
      </div>
      <div class="folha-wrap"><div id="folha"></div></div>
    </section>
  </template>

  <!-- CONFIG -->
  <template id="tpl-config">
    <section class="tela">
      <div class="card">
        <h2 class="card__titulo">Numeração</h2>
        <div class="grade">
          <label class="campo"><span>Próximo código do check-list</span><input id="cfgCodigo" inputmode="numeric"></label>
          <label class="campo"><span>Próximo nº da venda</span><input id="cfgVenda" inputmode="numeric"></label>
        </div>
      </div>
      <div class="card">
        <h2 class="card__titulo">Equipe</h2>
        <label class="campo"><span>Vendedores / vistoriadores (separe por vírgula)</span><input id="cfgVendedores"></label>
        <label class="campo"><span>Técnicos de instalação (separe por vírgula)</span><input id="cfgTecnicos"></label>
        <label class="campo"><span>Contas PIX (separe por vírgula)</span><input id="cfgPix"></label>
      </div>
      <button class="btn btn--primario" id="cfgSalvar">Salvar configurações</button>

      <div class="card mt">
        <h2 class="card__titulo">Backup dos dados</h2>
        <p class="dica">Os check-lists ficam salvos neste aparelho. Faça backup com frequência.</p>
        <div class="acoes">
          <button class="btn btn--leve" id="cfgExportar">Exportar backup (.json)</button>
          <label class="btn btn--leve">Importar backup<input type="file" accept=".json,application/json" id="cfgImportar" hidden></label>
          <button class="btn btn--leve" id="cfgCsv">Exportar planilha (.csv)</button>
        </div>
      </div>
      <div class="card" id="cardInstalar" hidden>
        <h2 class="card__titulo">Instalar aplicativo</h2>
        <p class="dica">Instale o check-list na tela inicial do celular para usar como aplicativo, mesmo sem internet.</p>
        <button class="btn btn--primario" id="btnInstalar">Instalar</button>
      </div>
      <p class="versao">FV Check-list v1.0</p>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
